[pytest]
# 此文件把 rootdir 锚定在 tests 目录:pytest 9 会把 test 文件所在目录的父包
# (jump_env, 含 __init__.py)当作 namespace 包 import 进来, 而 jump_env 包
# 会拉起 isaaclab -> omni(纯 torch 单测不需要)。rootdir=tests 目录时模块名
# 不再含 jump_env 前缀, 测试保持"不依赖 omni"可独立单测。
#   用法: cd /home/zyy/jump_high && pytest jump_env/tests/
testpaths = .
